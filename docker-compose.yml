services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting Docker Compose}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY before starting Docker Compose}
      DATABASE_URL: sqlite:////data/offline_face.db
      STORAGE_DIR: /data/storage
      MODEL_DIR: /app/ai/models
    volumes:
      - ./ai/models:/app/ai/models:ro
      - backend_data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  backend_data:
