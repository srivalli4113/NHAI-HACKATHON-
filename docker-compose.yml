services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      APP_SECRET_KEY: change-me-offline-secret-key-32-bytes
      DATABASE_URL: sqlite:////data/offline_face.db
      STORAGE_DIR: /data/storage
      MODEL_DIR: /app/ai/models
    volumes:
      - ./ai/models:/app/ai/models:ro
      - backend_data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  backend_data:

